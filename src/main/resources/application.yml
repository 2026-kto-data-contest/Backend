# 전통주 데이터 파이프라인과 회원·인증이 함께 사용하는 PostgreSQL 설정(H2 미사용).
spring:
  application:
    name: backend
  config:
    # 로컬 비밀값은 저장소 루트의 .env에 직접 설정한다. .env가 없어도 서버 자체는 실행 가능하다.
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jeontongjuro}
    username: ${DB_USERNAME:jeontongjuro}
    password: ${DB_PASSWORD:jeontongjuro}
    driver-class-name: org.postgresql.Driver
  jpa:
    # 스키마의 단일 진실은 schema.sql(BIGSERIAL·UNIQUE 제약 명시). Hibernate는 검증만 수행.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      # schema.sql은 CREATE TABLE IF NOT EXISTS 라 재기동 시에도 멱등.
      mode: always

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    session-duration: ${AUTH_SESSION_DURATION:14d}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}

# 지오코딩(#28 8단계) — 수빈 인증 라인 app.kakao.*와 분리한다. 같은 REST 키를 재사용하되 네임스페이스는 별개.
# api-key는 환경변수 KAKAO_REST_API_KEY 로만 주입(코드·yml·로그에 키 문자열 미기재). 미주입 시 8단계에서 명확히 중단.
geo:
  kakao:
    api-key: ${KAKAO_REST_API_KEY:}
    base-url: https://dapi.kakao.com

# TourAPI(한국관광공사 KorService2) 근접 캐싱(9단계)·매칭(10단계). 수집/지오코딩/인증과 무충돌 네임스페이스.
# service-key는 환경변수 AT_SERVICE_KEY(aT·KTO 공용) 로만 주입(코드·yml·로그에 키 문자열 미기재). 미주입 시 첫 호출에서 명확히 중단.
# ★radius-m은 하드코딩 아님 — 여기서만 조정(기획 피드백 대비). num-of-rows=100 — 상한 미검증(전제 11)이라 페이징을 상시 경로화.
tour:
  api:
    base-url: https://apis.data.go.kr/B551011/KorService2
    service-key: ${AT_SERVICE_KEY:}
    radius-m: 20000
    num-of-rows: 100
    mobile-app: jeontongjuro
    throttle-millis: 300

# aT 전통주 체험 프로그램(15단계, 이슈 #52) — odcloud 15089109. tour/geo처럼 도메인 전용 네임스페이스
# (pipeline.collect.*는 raw 수집용이라 재사용하지 않는다 — 프로퍼티 충돌 금지). dataset-id·uddi는 여기서만.
# service-key는 환경변수 AT_SERVICE_KEY 로만 주입(코드·yml·로그에 키 문자열 미기재). 미주입 시 15단계 skip(중단 아님).
experience:
  api:
    api-base: https://api.odcloud.kr/api
    service-key: ${AT_SERVICE_KEY:}
    dataset-id: "15089109"
    uddi: "c7468573-84ff-4a92-a84b-884439ce23d3"
    per-page: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

pipeline:
  collect:
    api-base: https://api.odcloud.kr/api
    # serviceKey는 환경변수 AT_SERVICE_KEY 로만 주입한다. 키 문자열을 코드·yml·로그에 기재하지 않는다.
    service-key: ${AT_SERVICE_KEY:}
    # snapshot-date(선택): 논리 스냅샷 라벨. 실행 시 --pipeline.collect.snapshot-date=2026-07-28 처럼 주입.
    # 미주입 시 collected_at의 UTC 날짜가 라벨이 된다(KST 등 로컬 타임존 파생 금지).
    brewery:
      dataset-id: "15048756"
      uddi: "60ae9d09-1e96-4636-b735-9346089d3160"
      per-page: 100
    product:
      dataset-id: "15048755"
      uddi: "f60051e9-9730-4686-b4df-a45a84e8a849"
      per-page: 1000
