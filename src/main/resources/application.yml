# 전통주 데이터 파이프라인과 회원·인증이 함께 사용하는 PostgreSQL 설정(H2 미사용).
spring:
  application:
    name: backend
  config:
    # 로컬 비밀값은 저장소 루트의 .env에 직접 설정한다. .env가 없어도 서버 자체는 실행 가능하다.
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jeontongjuro}
    username: ${DB_USERNAME:jeontongjuro}
    password: ${DB_PASSWORD:jeontongjuro}
    driver-class-name: org.postgresql.Driver
  jpa:
    # 스키마의 단일 진실은 schema.sql(BIGSERIAL·UNIQUE 제약 명시). Hibernate는 검증만 수행.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      # schema.sql은 CREATE TABLE IF NOT EXISTS 라 재기동 시에도 멱등.
      mode: always

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  auth:
    session-duration: ${AUTH_SESSION_DURATION:14d}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}

# 지오코딩(#28 8단계) — 수빈 인증 라인 app.kakao.*와 분리한다. 같은 REST 키를 재사용하되 네임스페이스는 별개.
# api-key는 환경변수 KAKAO_REST_API_KEY 로만 주입(코드·yml·로그에 키 문자열 미기재). 미주입 시 8단계에서 명확히 중단.
geo:
  kakao:
    api-key: ${KAKAO_REST_API_KEY:}
    base-url: https://dapi.kakao.com

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

pipeline:
  collect:
    api-base: https://api.odcloud.kr/api
    # serviceKey는 환경변수 AT_SERVICE_KEY 로만 주입한다. 키 문자열을 코드·yml·로그에 기재하지 않는다.
    service-key: ${AT_SERVICE_KEY:}
    # snapshot-date(선택): 논리 스냅샷 라벨. 실행 시 --pipeline.collect.snapshot-date=2026-07-28 처럼 주입.
    # 미주입 시 collected_at의 UTC 날짜가 라벨이 된다(KST 등 로컬 타임존 파생 금지).
    brewery:
      dataset-id: "15048756"
      uddi: "60ae9d09-1e96-4636-b735-9346089d3160"
      per-page: 100
    product:
      dataset-id: "15048755"
      uddi: "f60051e9-9730-4686-b4df-a45a84e8a849"
      per-page: 1000
